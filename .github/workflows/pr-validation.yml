name: PR Validation

# Runs on every PR targeting main — validates before merge is allowed
on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so we can analyze commits

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # ----------------------------------------------------------------
      # Tests
      # ----------------------------------------------------------------
      - name: Run tests
        run: npm test
        # If you have coverage: npm test -- --coverage

      # ----------------------------------------------------------------
      # Lint
      # ----------------------------------------------------------------
      - name: Run linter
        run: npm run lint
        # Adjust if your lint script has a different name

      # ----------------------------------------------------------------
      # Type check
      # ----------------------------------------------------------------
      - name: Type check
        run: npm run type-check
        # If you use tsc directly: npx tsc --noEmit

      - name: Build all workspaces
        run: npm run build

  e2e:
    name: E2E Tests (web)
    runs-on: ubuntu-latest
    needs: validate # only spend time on E2E if unit tests/lint/types already passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build web app
        run: npx turbo run build --filter=@finance-tracker/web...

      - name: Run Playwright E2E suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    needs: validate # only review if validation passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------
      # Security scan — look for hardcoded secrets in the diff
      # ----------------------------------------------------------------
      - name: Scan for secrets
        run: |
          echo "Scanning diff for potential secrets..."
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          DIFF=$(git diff "$BASE_SHA" "$HEAD_SHA")

          # Patterns that should never appear in committed code
          # Require no spaces in the value — real secrets don't contain spaces, error messages do
          if echo "$DIFF" | grep -iE "(api[_-]?key|secret|password|token)\s*=\s*['\"][^'\"\s]{8,}" ; then
            echo "::error::Potential hardcoded secret detected in diff"
            exit 1
          fi

          if echo "$DIFF" | grep -E "ghp_[a-zA-Z0-9]{36}" ; then
            echo "::error::GitHub token detected in diff"
            exit 1
          fi

          echo "No secrets found in diff."

      # ----------------------------------------------------------------
      # Basic quality checks on changed files
      # ----------------------------------------------------------------
      - name: Check for leftover debug code
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          DIFF=$(git diff "$BASE_SHA" "$HEAD_SHA")

          # Warn (don't block) on console.log / debugger / TODO
          if echo "$DIFF" | grep -E "^\+.*\b(console\.log|debugger)\b" ; then
            echo "::warning::Leftover debug code (console.log/debugger) found"
          fi
          echo "Quality check complete."
